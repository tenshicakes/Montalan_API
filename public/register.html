<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-secondary">

    <div class="container vh-100 d-flex justify-content-center align-items-center">

        <div class="card shadow p-4" style="width: 500px; border-radius: 15px;">

            <div class="text-center mb-4">
                <h3 class="fw-bold">Create Account</h3>
                <p class="text-muted">Register a new account</p>
            </div>

            <form id="registerForm">

                <div class="mb-3">
                    <label class="form-label">Name</label>
                    <input 
                        type="text" 
                        id="name" 
                        class="form-control" 
                        placeholder="Enter your name"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label class="form-label">Email Address</label>
                    <input 
                        type="email" 
                        id="email" 
                        class="form-control" 
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        class="form-control" 
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <!-- ✅ CAPTCHA -->
                <div class="mb-3">
                    <label class="form-label">CAPTCHA</label>
                    <p id="captchaQuestion" class="fw-bold"></p>
                    <input 
                        type="text" 
                        id="captchaAnswer" 
                        class="form-control"
                        placeholder="Enter CAPTCHA answer"
                        required
                    >
                </div>

                <div class="d-grid mb-3">
                    <button type="submit" class="btn btn-primary">
                        Register
                    </button>
                </div>

                <div class="text-center">
                    <small class="text-muted">
                        Already have an account? <a href="/">Login</a>
                    </small>
                </div>

            </form>

        </div>

    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // ✅ Load CAPTCHA from backend
        async function loadCaptcha() {
            try {
                const res = await fetch('/api/captcha', { credentials: 'include' });
                const data = await res.json();
                document.getElementById('captchaQuestion').innerText =
                    "Solve: " + data.question;
            } catch (err) {
                console.error('Error loading CAPTCHA:', err);
            }
        }

        // Load CAPTCHA on page load
        loadCaptcha();

        // ✅ Handle registration form submission
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const captchaAnswer = document.getElementById('captchaAnswer').value;

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include', // 🔥 important for session
                    body: JSON.stringify({ name, email, password, captchaAnswer })
                });

                const data = await response.json();

                if (response.ok) {
                    alert('Registration successful! Please log in.');
                    window.location.href = '/';
                } else {
                    alert('Registration failed: ' + data.message);
                    loadCaptcha(); // reload CAPTCHA on failure
                }
            } catch (error) {
                alert('Error: ' + error.message);
            }
        });
    </script>

</body>
</html>
