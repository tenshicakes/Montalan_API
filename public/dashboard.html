<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sample Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: sans-serif; margin: 0; display: flex; }
        .sidebar { width: 200px; background: #333; color: #fff; height: 100vh; padding: 20px; }
        .main-content { flex: 1; padding: 20px; background: #f4f4f4; }
        .header { background: #fff; padding: 10px; border-bottom: 1px solid #ddd; }
        .cards { display: flex; gap: 20px; margin-top: 20px; }
        .card { background: #fff; padding: 20px; flex: 1; border-radius: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>Menu</h2>
        <ul>
        
            
        </ul>
        <hr style="border-color: #555;">
        <p style="margin-top: auto;" id="userEmail"></p>
        <p id="userName" style="margin: 0; font-weight: 600;"></p>
        <button onclick="logout()" style="width: 100%; padding: 10px; background: #dc3545; color: #fff; border: none; border-radius: 5px; cursor: pointer;">Logout</button>
    </div>

    <div class="card mt-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="mb-0">Users</h3>
        <div>
          <button class="btn btn-primary" onclick="addUser()">Add user</button>
          <button class="btn btn-danger" onclick="toggleDeleteMode()">Delete users</button>
          <button class="btn btn-danger" id="confirmDelete" style="display:none;" onclick="confirmDelete()">Confirm Delete</button>
        </div>
      </div>

      <table class="table table-striped">
        <thead>
          <tr>
            <th id="selectTh" style="display:none;">Select</th>
            <th>Name</th>
            <th>Email</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="usersTable"></tbody>
      </table>
    </div>

    <script>
        window.addEventListener('load', loadUsers);

        let deleteMode = false;

        function loadUsers() {
            const token = localStorage.getItem('authToken');
            if (!token) return window.location.href = '/';
            try {
                const payload = JSON.parse(atob(token.split('.')[1]));
                document.getElementById('userEmail').textContent = payload.email;
                document.getElementById('userName').textContent = payload.email.split('@')[0];
            } catch {
                localStorage.removeItem('authToken');
                window.location.href = '/';
            }
            fetchUsers();
        }

        async function fetchUsers() {
            const res = await fetch('/api/users');
            const users = await res.json();
            const table = document.getElementById('usersTable');
            table.innerHTML = '';
            document.getElementById('selectTh').style.display = deleteMode ? 'table-cell' : 'none';
            users.forEach(user => {
                table.innerHTML += `
      <tr>
        <td style="display: ${deleteMode ? 'table-cell' : 'none'}"><input type="checkbox" class="user-checkbox" value="${user.id}"></td>
        <td>${user.name || ''}</td>
        <td>${user.email}</td>
        <td>
          <button class="btn btn-warning btn-sm" onclick="editUser(${user.id})">Edit</button>
          <button class="btn btn-danger btn-sm" onclick="deleteUser(${user.id})">Delete</button>
        </td>
      </tr>
    `;
            });
        }

        function toggleDeleteMode() {
            deleteMode = !deleteMode;
            document.getElementById('confirmDelete').style.display = deleteMode ? 'inline-block' : 'none';
            fetchUsers();
        }

        async function confirmDelete() {
            const selected = Array.from(document.querySelectorAll('.user-checkbox:checked')).map(cb => cb.value);
            if (selected.length === 0) {
                alert('No users selected');
                return;
            }
            if (!confirm(`Delete ${selected.length} users?`)) return;
            for (const id of selected) {
                await fetch(`/api/users/${id}`, { method: 'DELETE' });
            }
            deleteMode = false;
            fetchUsers();
        }

        // ---- Admin Add User (bypass CAPTCHA) ----
        async function addUser() {
            const name = prompt('Name:'); if (!name) return;
            const email = prompt('Email:'); if (!email) return;
            const password = prompt('Password:'); if (!password) return;

            const res = await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, email, password, captchaAnswer: 'bypass' })
            });

            if (!res.ok) {
                const data = await res.json().catch(() => ({}));
                alert('Failed to create user: ' + (data.message || res.statusText));
                return;
            }

            fetchUsers();
        }

        async function deleteUser(id) {
            if (!confirm('Delete this user?')) return;
            await fetch(`/api/users/${id}`, { method: 'DELETE' });
            fetchUsers();
        }

        async function editUser(id) {
            const newEmail = prompt('New email:'); if (!newEmail) return;
            await fetch(`/api/users/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: newEmail })
            });
            fetchUsers();
        }

        function logout() {
            localStorage.removeItem('authToken');
            window.location.href = '/';
        }
    </script>
</body>
</html>
